<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00e0b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0e0e1a"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="1.5"/>
  <!-- token ring: three arcs -->
  <circle cx="32" cy="35" r="21" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="32.98 11" transform="rotate(-75 32 35)"/>
  <!-- antenna signal -->
  <path d="M32 24v-11" stroke="#00e0b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="9.5" r="3.6" fill="#00e0b8"/>
  <!-- agent head with scanning visor -->
  <rect x="20" y="24" width="24" height="20" rx="8" fill="url(#g)"/>
  <rect x="24" y="31" width="16" height="6" rx="3" fill="#0b0b14"/>
  <circle cx="29" cy="34" r="1.9" fill="#00e0b8">
    <animate attributeName="cx" values="27;37;27" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
